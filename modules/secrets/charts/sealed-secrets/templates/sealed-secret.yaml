apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.name }}
  labels: {{ toYaml .Values.labels | nindent 4 }}
  annotations:
    {{- if eq .Values.scope "namespace-wide" }}
    sealedsecrets.bitnami.com/namespace-wide: "true"
    {{- else if eq .Values.scope "cluster-wide" }}
    sealedsecrets.bitnami.com/cluster-wide: "true"
    {{- end }}
spec:
  encryptedData: {{ toYaml .Values.encryptedData | nindent 4 }}
  template:
    type: {{ .Values.type }}
    metadata:
      name: {{ .Values.name }}
      labels: {{ toYaml .Values.labels | nindent 8 }}
