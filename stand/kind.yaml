kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # kindnet начиная с kind v0.24 выполняет NetworkPolicy — сетевые политики модулей работают.
  disableDefaultCNI: false
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
      - containerPort: 30443
        hostPort: 8443
