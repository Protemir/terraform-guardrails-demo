# Исключения из правил. Каждая запись проходит ревью в pull request.
# Обязательные поля:
#   rule     — ID правила (наши: PUB-001…, Checkov: CKV_…, Trivy: AVD-…)
#   resource — адрес ресурса или путь к файлу; допускается * (glob)
#   reason   — обоснование, от 15 символов (ссылка на задачу приветствуется)
#   owner    — кто отвечает за исключение
#   expires  — дата окончания, не дальше 180 дней; после неё правило снова блокирует
# Запись без любого из полей не действует и сама блокирует слияние (EXC-001).
exceptions:
  - rule: CKV_TF_1
    resource: "*"
    reason: "Модули библиотеки подключаются локальными путями внутри репозитория; закрепление по SHA проверяет наше правило SRC-001 для внешних источников"
    owner: platform
    expires: "2027-05-01"
  - rule: CKV_SECRET_6
    resource: "modules/secrets/*"
    reason: "Образец шифртекста kubeseal в примере и тесте модуля secrets: это не секрет, расшифровать его без ключа контроллера нельзя"
    owner: platform
    expires: "2027-05-01"
  - rule: PUB-003
    resource: "kubernetes_daemon_set_v1.net_probe*"
    reason: "Агент замеров сетевой задержки узлов работает в host network; заменим на eBPF-экспортер, задача PLAT-214"
    owner: platform
    expires: "2027-02-28"
